<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History</title>
    <!-- This is how I link up the CSS -->
    <!-- I had to use a special method to allow Flask to reach the stylesheet  -->
     <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <!-- This is how I am adding the ability to use icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- This is where I add Bootstrap -->
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <header id="history-header">History</header>
    <div id="button-wrapper">
        <button id="stats-button"><a href="{{ url_for('stats') }}">Want to see your stats?</a></button>
    </div>
    <div id="table-wrapper">
        <table id="history-table" class="table table-striped">
            <tr>
                <th>Date</th>
                <th>Muscle group</th>
                <th>Machine</th>
                <th>Weight</th>
                <th>Reps</th>
            </tr>

            <!-- I'm going to use some Jinja here -->

            {% for row in data %}
            <tr>
                <td>{{ row[0] }}</td>
                <td>{{ row[1] }}</td>
                <td>{{ row[2] }}</td>
                <td>{{ row[3] }}</td>
                <td>{{ row[4] }}</td>
            </tr>
            {%endfor%}
        </table>
    </div>
    <footer>Made by <a href="https://github.com/kelseyonline">@kelseyonline</a> on Github</footer>
</body>
</html>
